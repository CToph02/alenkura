<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login</title>
</head>

<body>
    <main>
        <div class="flex flex-col items-center justify-center h-screen bg-emerald-100">
            <h1 class="text text-3xl mb-4 font-bold">Bienvenido a Alenkura</h1>
            <form class="flex flex-col rounded-lg p-10 content-center shadow-2xl bg-white border-2 border-gray-300" method="post">
                {% csrf_token %}

                <label for="user">Correo electrónico</label>
                <input class="border-2 border-gray-300 rounded-lg mb-5 p-2 bg-white" name="email" type="email"
                    placeholder="Ingrese su email" required>

                <label for="passwd">Contraseña</label>
                <input class="border-2 border-gray-300 rounded-lg mb-5 p-2 bg-white" name="password" type="password"
                    placeholder="Ingrese su contraseña" required>

                <button class="rounded-lg p-2 bg-blue-600 text-white hover:bg-blue-700 cursor-pointer"
                    type="submit">Iniciar sesión</button>
            </form>
        </div>
    </main>
</body>

</html>
