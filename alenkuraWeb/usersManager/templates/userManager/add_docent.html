{% extends './../base/base.html' %}
{% block title %}index{% endblock %}
{% block content %}
<form class="grid grid-cols-2 gap-4 rounded-lg p-6 shadow-2xl bg-white border-2 border-gray-100" method="post" action="{% url 'create_docent' %}">
    {% csrf_token %}

    <!-- Título -->
    <h1 class="col-span-2 text-3xl font-semibold mb-2">Agregar docente</h1>

    <!-- Nombre -->
    <div class="flex flex-col">
        <label for="user" class="font-medium">Nombre docente:</label>
        <input class="border rounded-lg p-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 border-2 border-gray-100 outline-none focus:border-gray-300 focus:"
               name="username" type="text" placeholder="Ingrese nombre docente" required>
    </div>

    <!-- Correo -->
    <div class="flex flex-col">
        <label for="email" class="font-medium">Correo docente:</label>
        <input class="border rounded-lg p-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 border-2 border-gray-100"
               name="email" type="email" placeholder="Ingrese correo" required>
    </div>

    <!-- Teléfono -->
    <div class="flex flex-col">
        <label for="phone" class="font-medium">Número celular docente:</label>
        <input class="border rounded-lg p-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 border-2 border-gray-100"
               name="phone" type="tel" placeholder="Ingrese número celular" required>
    </div>

    <!-- Tipo de docente -->
    <div class="flex flex-col">
        <label for="typeDocent" class="font-medium">Seleccione el nivel del docente:</label>
        <select class="border rounded-lg p-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 border-2 border-gray-100"
                name="nivel" id="nivel" required>
            {% for r in rol %}
                <option value="{{ r.rol }}">{{ r.rol }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="flex flex-col">
        <label for="typeDocent" class="font-medium">Seleccione el curso del docente:</label>
        <select class="border rounded-lg p-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 border-2 border-gray-100"
                name="curso" id="curso" required>
                {% for c in curso %}
                    <option value="{{ c.curso }}">{{ c.curso }} - {{ c.fk_nivel }}</option>
                {% endfor %}
        </select>
    </div>

    <!-- Botón -->
    <div class="col-span-2 flex justify-center mt-2">
        <button class="rounded-lg px-6 py-2 bg-blue-600 text-white hover:bg-blue-700 transition duration-300 ease-in-out"
                type="submit">
            Agregar Docente
        </button>
    </div>
</form>

{% endblock %}

<script>
    document.getElementById('nivel').addEventListener('change', function(){
        const nivelId = this.value;
        const curso = document.getElementById('curso')
        curso.innerHTML = '<option>Cargando...</option>'
        console.log("Hola")

        if (nivelId){
            fetch("cursoPorNivel/?nivel${nivelId}")
            .then(response => response.json)
            .then(data =>{
                curso.innerHTML = '<option value="{{ group.name }}">>-- Seleccione un curso --<</option>'
                data.cursos.forEach(curso => {
                    const option = document.createElement('option');
                    option.value = curso.id;
                    option.textContent = curso.curso;
                    curso.appendChild(option);
                });
            });
        }else{
            curso.innerHTML = '<option value="{{ group.name }}">>-- Seleccione un curso --<</option>'
        }
    });
</script>
